<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alquimia — Editor de Placas con Fondo Mosaico 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,400&family=Alex+Brush&family=Cinzel:wght@600;800&family=Syne:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,600&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
</head>
<body style="background: var(--color-paper); min-height: 100vh; overflow-x: hidden;">

  <!-- Header simulado de Alquimia -->
  <header class="barra" style="position: sticky; top: 0; z-index: 100;">
    <div class="marco" style="display:flex; justify-content:space-between; align-items:center;">
      <div class="logotipo" style="display:flex; align-items:center; gap:8px; font-weight:800;">
        <img src="/img/logo.svg" alt="Logo" class="logo-img" width="32" height="32" onerror="this.style.display='none'">
        Alquimia
      </div>
      <nav style="display:flex; align-items:center; gap:16px;">
        <button class="btn chico" style="background:var(--color-mint); color:var(--color-ink);">Generar contenido</button>
      </nav>
    </div>
  </header>

  <!-- Contenedor principal con el editor y fondo mosaico 3D montado -->
  <div id="contenedor-demo" style="position: relative; min-height: calc(100vh - var(--bar-h, 70px)); padding: 24px 20px 80px;">
  </div>

  <script type="module">
    import { montarFondoMosaico } from '/js/mosaico-fondo.js';

    const cont = document.getElementById('contenedor-demo');
    montarFondoMosaico(cont);

    // Mock del editor side-by-side de Alquimia
    const editorDiv = document.createElement('div');
    editorDiv.className = 'editor';
    editorDiv.innerHTML = `
      <div class="editor-form">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="rotulo" style="font-family:var(--font-label); font-size:0.75rem; text-transform:uppercase; color:var(--color-muted);">Post de feed · 1080×1350</span>
          <button class="btn texto chico" style="font-size:0.85rem; color:var(--color-muted); cursor:pointer;">← Volver</button>
        </div>

        <div>
          <label style="font-family:var(--font-label); font-size:0.75rem; font-weight:600; color:var(--color-muted); text-transform:uppercase;">Plantilla</label>
          <div class="pestanas" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
            <button class="btn chico elegida" style="background:var(--color-ink); color:white; padding:6px 14px; border-radius:10px;">📝 Texto</button>
            <button class="btn chico" style="background:var(--color-paper-2); padding:6px 14px; border-radius:10px;">🔢 Pasos</button>
            <button class="btn chico" style="background:var(--color-paper-2); padding:6px 14px; border-radius:10px;">🏷️ Oferta</button>
            <button class="btn chico" style="background:var(--color-paper-2); padding:6px 14px; border-radius:10px;">💬 Frase</button>
            <button class="btn chico" style="background:var(--color-paper-2); padding:6px 14px; border-radius:10px;">📸 Foto</button>
          </div>
        </div>

        <div class="campo" style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-family:var(--font-label); font-size:0.75rem; font-weight:600; color:var(--color-muted); text-transform:uppercase;">Volanta / Kicker</label>
          <input type="text" value="MASA MADRE" style="padding:12px 14px; border-radius:12px; border:1.5px solid var(--color-rule); font-family:var(--font-body); font-size:0.95rem; background:var(--color-paper);">
        </div>

        <div class="campo" style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-family:var(--font-label); font-size:0.75rem; font-weight:600; color:var(--color-muted); text-transform:uppercase;">Título principal</label>
          <input type="text" value="Tres días para un buen pan" style="padding:12px 14px; border-radius:12px; border:1.5px solid var(--color-rule); font-family:var(--font-body); font-size:1.1rem; font-weight:700; background:var(--color-paper);">
        </div>

        <div class="campo" style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-family:var(--font-label); font-size:0.75rem; font-weight:600; color:var(--color-muted); text-transform:uppercase;">Cuerpo del texto</label>
          <textarea rows="4" style="padding:12px 14px; border-radius:12px; border:1.5px solid var(--color-rule); font-family:var(--font-body); font-size:0.95rem; background:var(--color-paper); resize:vertical;">El proceso de fermentación lenta de 72 horas que transforma harina, agua y sal en algo inolvidable.</textarea>
        </div>

        <div style="display:flex; gap:12px; margin-top:8px;">
          <button class="btn grande" style="flex:1; background:var(--color-mint); color:var(--color-ink); font-weight:700; padding:14px; border-radius:14px; border:none; box-shadow:0 4px 0 oklch(70% 0.18 150), 0 8px 20px rgba(0,0,0,0.1); cursor:pointer;">
            Generar Placa HD (2x) →
          </button>
        </div>
      </div>

      <div class="editor-vista">
        <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-family:var(--font-label); font-size:0.75rem; color:var(--color-muted); text-transform:uppercase;">Vista previa en vivo</span>
          <span style="font-family:var(--font-label); font-size:0.7rem; color:var(--color-mint-deep); font-weight:600;">✓ SIN CONSUMIR CUOTA</span>
        </div>
        <div class="lienzo" style="width:360px; height:450px; background:#faf7f2; display:flex; flex-direction:column; justify-content:space-between; padding:32px 28px; border-radius:18px; border:1.5px solid var(--color-rule); box-shadow:0 12px 36px rgba(0,0,0,0.08); position:relative; overflow:hidden;">
          <div>
            <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:0.85rem; color:oklch(45% 0.18 25);">
              <span style="background:oklch(45% 0.18 25); color:white; width:28px; height:28px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:800;">PM</span>
              Panadería Mendieta
            </div>
          </div>
          <div>
            <div style="font-family:var(--font-label); font-size:0.75rem; letter-spacing:0.12em; color:var(--color-muted); margin-bottom:6px;">—— MASA MADRE</div>
            <div style="font-size:1.6rem; font-weight:800; line-height:1.15; color:var(--color-ink);">
              Tres días para <span style="color:oklch(45% 0.18 25);">un buen pan</span>
            </div>
            <div style="font-size:0.88rem; line-height:1.5; color:var(--color-ink-2); margin-top:12px; opacity:0.85;">
              El proceso de fermentación lenta de 72 horas que transforma harina, agua y sal en algo inolvidable.
            </div>
          </div>
          <div style="font-family:var(--font-label); font-size:0.7rem; color:var(--color-muted); letter-spacing:0.08em; text-transform:uppercase;">
            @PANADERIAMENDIETA
          </div>
        </div>
      </div>
    `;

    cont.append(editorDiv);
  </script>
</body>
</html>
